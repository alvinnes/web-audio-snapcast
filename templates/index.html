<!DOCTYPE html>
<html>

<head>

<title>Office Audio Control</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.song{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

input[type=range]{
    width:100%;
}

@media (max-width:768px){

button{
    width:100%;
}

.song{
    flex-direction:column;
    align-items:flex-start;
}

}

</style>

</head>

<body>

<h1>🎛 Office Audio Control</h1>

<div class="card">

<h2 id="status">
READY
</h2>

<div id="songinfo">
No Song
</div>

</div>

<div class="card">

<button onclick="musicOn()">
▶️ Music ON
</button>

<button onclick="musicOff()">
⛔ Music OFF
</button>

<button onclick="pagingOn()">
🎤 Paging ON
</button>

<button onclick="pagingOff()">
🔇 Paging OFF
</button>

</div>

<div class="card">

<h2>🎵 Playlist Control</h2>

<button onclick="prevMusic()">
⏮ PREV
</button>

<button onclick="nextMusic()">
⏭ NEXT
</button>

<button onclick="randomMusic()">
🔀 RANDOM
</button>

<br><br>

<label>🔊 Volume</label>

<input type="range"
       min="0"
       max="2"
       step="0.1"
       value="1"
       onchange="setVolume(this.value)">

</div>

<div class="card">

<h2>📺 YouTube Audio</h2>

<input type="text"
       id="yturl"
       placeholder="Paste YouTube URL"
       style="width:100%;padding:10px">

<br><br>

<button onclick="playYoutube()">
▶ PLAY YOUTUBE
</button>

</div>

<div class="card">

<h2>📤 Upload Lagu</h2>

<form action="/upload" method="post" enctype="multipart/form-data">

<input type="file" name="file">

<button type="submit">
UPLOAD
</button>

</form>

</div>

<div class="card">

<h2>🎵 Playlist</h2>

{% for f in files %}

<div class="song">

<div>
🎵 {{ f }}
</div>

<button onclick="playMusic('{{ f }}')">
▶ PLAY
</button>

</div>

{% endfor %}

</div>

<script>

function musicOn(){
    fetch('/music/on')
}

function musicOff(){
    fetch('/music/off')
}

function pagingOn(){
    fetch('/paging/on')
}

function pagingOff(){
    fetch('/paging/off')
}

function playMusic(name){
    fetch('/play/' + encodeURIComponent(name))
}

function nextMusic(){
    fetch('/next')
}

function prevMusic(){
    fetch('/prev')
}

function randomMusic(){
    fetch('/random')
}

function setVolume(v){
    fetch('/volume/' + v)
}

function playYoutube(){

    let url = document.getElementById("yturl").value

    fetch('/youtube', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body: JSON.stringify({
            url:url
        })
    })
}

async function refreshStatus(){

    const r = await fetch('/status')

    const data = await r.json()

    let text = "IDLE"

    if(data.music)
        text = "🎵 MUSIC"

    if(data.paging)
        text = "🎤 PAGING"

    document.getElementById("status").innerText = text

    document.getElementById("songinfo").innerText =
        data.song
}

setInterval(refreshStatus, 2000)

refreshStatus()

</script>

</body>
</html>
